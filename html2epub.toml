# html2epub config for "Building Vision AI: From Pixels to Generative Models"
# Run: python -m html2epub build .
[book]
title = "Building Vision AI: From Pixels to Generative Models"
subtitle = "A practitioner's guide to image processing, classical computer vision, deep learning, and generative vision models"
edition = "First Edition"
language = "en"
identifier = "urn:uuid:visionbook-first-edition-2026"
publisher = "Apartsin & Aperstein"
rights = "Copyright (c) 2026 Alexander Apartsin and Yehudit Aperstein. All rights reserved."
publication_date = "2026-06-14"
description = """A practitioner's guide to computer vision in 39 chapters across four parts: \
image processing, classical computer vision, deep learning for vision, and generative vision \
models. Every core idea is built from scratch and then shown with the modern library that makes \
it a few lines of code. Covers filtering and the frequency domain, features and multi-view \
geometry, CNNs and vision transformers, detection and segmentation, self-supervised foundation \
models, NeRF and 3D Gaussian splatting, diffusion and text-to-image systems, controllable \
generation, video and world models, and honest evaluation, with 244 illustrations, hands-on \
labs, and exercises."""
keywords = [
  "computer vision OpenCV scikit-image image processing",
  "deep learning CNN vision transformer PyTorch tutorial",
  "object detection segmentation YOLO SAM DETR",
  "diffusion models Stable Diffusion text-to-image",
  "NeRF 3D Gaussian splatting structure from motion",
  "self-supervised foundation models CLIP DINO MAE",
]

[[book.authors]]
name = "Alexander Apartsin"
file_as = "Apartsin, Alexander"
role = "aut"

[[book.authors]]
name = "Yehudit Aperstein"
file_as = "Aperstein, Yehudit"
role = "aut"

[content]
source_dir = "."
spine = "auto"
front_matter_dir = "front-matter"
parts_glob = "part-*"
module_glob = "module-*"
appendices_dir = "appendices"
capstone_dir = "capstone"
section_glob = "section-*.html"
fm_order = [
  "foreword.html",
  "fm-what-this-book-covers.html",
  "fm-who-should-read.html",
  "look-inside-preview.html",
  "fm-how-to-use.html",
  "about-authors.html",
  "copyright.html",
]

[styling]
stylesheets = ["styles/book.css", "styles/pygments.css"]

[math]
render = "katex"
node_exe = "node"
katex_path = "KDP/build/node_modules"

[images]
max_side = 1100
jpeg_quality = 80
compress_pngs = true

[cover]
path = "KDP/cover/cover_kdp.jpg"

[transforms]
wide_table_min_cols = 6
slim_index_lists = true
drop_inline_style_over = 1500
# Drop web-only chrome: the Pagefind search box + its assets, analytics, and
# the client-side book.js / KaTeX-autorender / Prism scripts (the EPUB renders
# math and code at build time, so none of the runtime JS is needed).
drop_selectors = [
  ".no-epub",
  ".header-search",
  "script[src*='pagefind']",
  "link[href*='pagefind']",
  "script[src*='analytics']",
  "script[src*='book.js']",
]

[output]
epub = "KDP/output/building-vision-ai.epub"

[optimize]
repair_entities = true
