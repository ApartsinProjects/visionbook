# KDP description field (<= 4000 chars, limited HTML allowed). Plain version:
description: >
  Building Vision AI is a practitioner's guide to computer vision in 39 chapters
  across four parts: image processing, classical computer vision, deep learning for
  vision, and generative vision models. Every core idea is built from scratch and
  then shown with the modern library that makes it a few lines of code. It covers
  spatial filtering and the frequency domain, features and multi-view geometry,
  convolutional networks and vision transformers, object detection and segmentation,
  self-supervised foundation models, monocular depth, NeRF and 3D Gaussian splatting,
  variational autoencoders, GANs, diffusion and text-to-image systems, controllable
  generation and editing, video and world models, and honest evaluation and
  governance. With 244 illustrations, inline diagrams, runnable code, hands-on labs,
  and exercises, it takes you from your first NumPy pixel manipulation to fine-tuning
  diffusion models, told as one connected story.

